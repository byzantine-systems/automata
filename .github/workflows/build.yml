name: "[Nix] Build & Tests"

on:
  push:
    branches: [ "main" ]
    paths:
      - '.config/dotnet-tools.json'
      - '.github/**'
      - 'docs/**'
      - 'examples/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'deps.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'docfx.json'
      - 'flake.nix'
      - 'flake.lock'
      - 'global.json'
      - 'Makefile'
      - 'nuget.config'
      - 'README.md'
  pull_request:
    paths:
      - '.config/dotnet-tools.json'
      - '.github/**'
      - 'docs/**'
      - 'examples/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'deps.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'docfx.json'
      - 'flake.nix'
      - 'flake.lock'
      - 'global.json'
      - 'Makefile'
      - 'nuget.config'
      - 'README.md'

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bs-automata
          POSTGRES_USER: bs-automata
          POSTGRES_PASSWORD: bs-automata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bs-automata -d bs-automata"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AUTOMATA_TEST_DB: Host=127.0.0.1;Port=5432;Database=bs-automata;Username=bs-automata;Password=bs-automata

    permissions:
      contents: read
      actions: write

    steps:
    - uses: actions/checkout@v7
      with:
        token: ${{ github.token }}

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        # Mostly to avoid GitHub rate limiting
        # keep-env-derivations/keep-outputs protect the ci shell's flake inputs
        # and shell derivation from the pre-save garbage collection below.
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          keep-env-derivations = true
          keep-outputs = true

    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 1G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-last-accessed: P1DT12H
        purge-primary-key: never

    - name: Build
      run: nix build

    - name: Run testing suite with coverage
      run: nix develop .#ci --impure -c make coverage

    - name: Code coverage summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage/Cobertura.xml
        badge: true
        format: markdown
        output: both
        thresholds: '60 80'

    - name: Publish coverage to job summary
      run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

    - name: Extract coverage percentage and color
      id: coverage
      run: |
        line_rate=$(grep -m1 -oP 'line-rate="\K[0-9.]+' coverage/Cobertura.xml)
        percent=$(awk -v r="$line_rate" 'BEGIN { printf "%.1f", r * 100 }')
        color=$(awk -v p="$percent" 'BEGIN {
          if (p < 60) print "red"
          else if (p < 80) print "yellow"
          else print "green"
        }')
        echo "percent=$percent" >> "$GITHUB_OUTPUT"
        echo "color=$color" >> "$GITHUB_OUTPUT"

    - name: Prepare badges directory
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: mkdir -p badges

    - name: Generate coverage badge
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: jaywcjlove/generated-badges@main
      with:
        label: coverage
        status: ${{ steps.coverage.outputs.percent }}%
        color: ${{ steps.coverage.outputs.color }}
        output: badges/coverage.svg

    - name: Upload Pages artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./badges

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

name: "[Nix] Build & Tests"

on:
  push:
    branches: [ "main" ]
    paths:
      - '.config/dotnet-tools.json'
      - '.github/**'
      - 'docs/**'
      - 'examples/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'deps.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'docfx.json'
      - 'flake.nix'
      - 'flake.lock'
      - 'global.json'
      - 'Makefile'
      - 'nuget.config'
      - 'README.md'
  pull_request:
    paths:
      - '.config/dotnet-tools.json'
      - '.github/**'
      - 'docs/**'
      - 'examples/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'deps.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'docfx.json'
      - 'flake.nix'
      - 'flake.lock'
      - 'global.json'
      - 'Makefile'
      - 'nuget.config'
      - 'README.md'

jobs:
  build:

    runs-on: ubuntu-latest

    # PostgreSQL comes from the devenv shell rather than a services: container, so CI runs the
    # same server as local development: the pinned postgresql_19 from the flake, with pgmq and
    # pg_cron built against it and the settings in flake.nix applied. The official postgres:19
    # image ships neither extension, and the command inbox is only the first part of this schema
    # to need neither.
    env:
      AUTOMATA_TEST_DB: Host=127.0.0.1;Port=5432;Database=bs-automata;Username=bs-automata;Password=bs-automata
      # The runner's own user is the devenv cluster's superuser, trusted over local TCP as on a
      # development machine. The pg_cron test needs one: installing the extension and scheduling
      # jobs are both superuser work, and running it here proves the path where the database
      # schedules its own maintenance, not only the fallback.
      AUTOMATA_TEST_CRON_DB: Host=127.0.0.1;Port=5432;Database=bs-automata;Username=runner

    permissions:
      contents: read
      actions: write

    steps:
    - uses: actions/checkout@v7
      with:
        token: ${{ github.token }}

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        # Mostly to avoid GitHub rate limiting
        # keep-env-derivations/keep-outputs protect the ci shell's flake inputs
        # and shell derivation from the pre-save garbage collection below.
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          keep-env-derivations = true
          keep-outputs = true

    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 1G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-last-accessed: P1DT12H
        purge-primary-key: never

    # devenv's own binary cache. Without it the shell is built from source on every cold runner.
    - uses: cachix/cachix-action@v17
      with:
        name: devenv

    - name: Build
      run: nix build

    # --impure because the devenv shell reads PWD to locate its state directory.
    #
    # --detached, not --detach: devenv forwards the flag to process-compose, which rejects the
    # latter while devenv still exits 0, so the typo starts nothing and shows a green step.
    - name: Start PostgreSQL
      run: nix develop --impure --command devenv up --detached

    # devenv reports its supervisor up before postgres finishes starting, and initdb on a cold
    # runner is not instant. Poll the socket rather than sleeping a guessed interval.
    - name: Wait for PostgreSQL
      run: |
        # shellcheck disable=SC2016 # the loop is expanded by the inner shell, not this one
        nix develop --impure --command bash -c '
          for attempt in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -q; then
              echo "ready after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready"; exit 1
        '

    # The generated schema types must match what the migrations produce. This replaced the
    # hand-maintained column lists, and it only protects anything if it runs on every change.
    - name: Check generated schema types
      run: nix develop .#ci --impure -c make schema-check

    - name: Run testing suite with coverage
      run: nix develop .#ci --impure -c make coverage

    # Documentation is the GitHub Pages site. Build it for pull requests too, so broken docs are
    # caught before merge; only main uploads and deploys the result below.
    - name: Build documentation
      run: nix develop .#ci --impure -c make docs

    - name: Code coverage summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage/Cobertura.xml
        badge: true
        format: markdown
        output: both
        thresholds: '60 80'

    - name: Publish coverage to job summary
      run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

    - name: Extract coverage percentage and color
      id: coverage
      run: |
        line_rate=$(grep -m1 -oP 'line-rate="\K[0-9.]+' coverage/Cobertura.xml)
        percent=$(awk -v r="$line_rate" 'BEGIN { printf "%.1f", r * 100 }')
        color=$(awk -v p="$percent" 'BEGIN {
          if (p < 60) print "red"
          else if (p < 80) print "yellow"
          else print "green"
        }')
        echo "percent=$percent" >> "$GITHUB_OUTPUT"
        echo "color=$color" >> "$GITHUB_OUTPUT"

    - name: Generate coverage badge
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: jaywcjlove/generated-badges@main
      with:
        label: coverage
        status: ${{ steps.coverage.outputs.percent }}%
        color: ${{ steps.coverage.outputs.color }}
        output: out/docs/coverage.svg

    - name: Upload Pages artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./out/docs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

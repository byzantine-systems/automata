name: "[.NET] Build & Test"

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'Makefile'
      - 'README.md'
      - 'docfx.json'
      - 'docs/**'
      - '.config/dotnet-tools.json'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'nuget.config'
  pull_request:
    paths:
      - '.github/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'tools/**'
      - 'Makefile'
      - 'README.md'
      - 'docfx.json'
      - 'docs/**'
      - '.config/dotnet-tools.json'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'nuget.config'

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ github.token }}

    - name: Install Nix
      uses: cachix/install-nix-action@v30
      with:
        # Mostly to avoid GitHub rate limiting
        # keep-env-derivations/keep-outputs protect the ci shell's flake inputs
        # and shell derivation from the pre-save garbage collection below.
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          keep-env-derivations = true
          keep-outputs = true

    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 1G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-last-accessed: P1DT12H
        purge-primary-key: never

    - name: Build
      run: nix develop .#ci --impure -c make build
    - name: Run testing suite
      run: nix develop .#ci --impure -c make test
    - name: Build documentation
      run: nix develop .#ci --impure -c make docs
    - name: Smoke-test packages
      run: nix develop .#ci --impure -c make package-smoke
    - name: Check Nix outputs and formatting
      run: nix flake check

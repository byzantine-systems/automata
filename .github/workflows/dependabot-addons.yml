name: "[Nix] Dependabot Post-Processing"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-adjustments:
    runs-on: ubuntu-latest
    # Strictly ensure this only runs for PRs initiated by Dependabot
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Check out the pull request head branch instead of the merge commit
          ref: ${{ github.event.pull_request.head.ref }}
          # Use a custom token if this push needs to trigger other GitHub Actions
          token: ${{ secrets.GITHUB_TOKEN }}
          # The bump detection below diffs against the parent commit
          fetch-depth: 2

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # Mostly to avoid GitHub rate limiting
          # keep-env-derivations/keep-outputs protect the ci shell's flake inputs
          # and shell derivation from the pre-save garbage collection below.
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # devenv's own binary cache. Without it the shell is built from source on every cold runner.
      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      # The .NET SDK comes from the locked nixpkgs, so a global.json bump (dotnet-sdk ecosystem)
      # can only build once nixpkgs carries the matching version. Re-pin nixpkgs in the same PR
      # and stage flake.lock alongside the regenerated deps.json below.
      - name: "Re-pin nixpkgs when global.json changed"
        run: |
          if git diff --name-only HEAD~1 HEAD -- global.json | grep -q .; then
            echo "global.json bumped; updating the nixpkgs lock to match"
            nix flake update nixpkgs
            git add flake.lock
          else
            echo "global.json unchanged; keeping the current nixpkgs lock"
          fi

      - name: "Generate new deps.json lockfile + SQLHydra updates"
        run: |
          nix develop --impure --command make nix-lock
          nix develop --impure --command make schema-generate-sqlite

      - name: Commit and Push Generated File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # deps.json is regenerated above; flake.lock may already be staged by the re-pin step
          git add deps.json
          
          # Check if there are actual changes to commit to avoid workflow failure
          if ! git diff --cached --exit-code; then
            git commit -m "chore: update generated files after dependabot update [dependabot skip]"
            git push
          else
            echo "No changes detected in generated files."
          fi

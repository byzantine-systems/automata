name: Nuget

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  push:
    name: Push to Nuget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # Mostly to avoid GitHub rate limiting
          # keep-env-derivations/keep-outputs protect the ci shell's flake inputs
          # and shell derivation from the pre-save garbage collection below.
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # devenv's own binary cache. Without it the shell is built from source on every cold runner.
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      # The integration suite is where ordering, fencing and atomicity are actually proven, so
      # nothing is published without it. PostgreSQL comes from the devenv shell, exactly as in
      # build.yml; see the comments there for --detached and for polling rather than sleeping.
      - name: Start PostgreSQL
        run: nix develop --impure --command devenv up --detached

      - name: Wait for PostgreSQL
        run: |
          # shellcheck disable=SC2016 # the loop is expanded by the inner shell, not this one
          nix develop --impure --command bash -c '
            for attempt in $(seq 1 60); do
              if pg_isready -h 127.0.0.1 -p 5432 -q; then
                echo "ready after ${attempt}s"; exit 0
              fi
              sleep 1
            done
            echo "postgres did not become ready"; exit 1
          '

      - name: Check generated schema types
        run: nix develop .#ci --impure -c make schema-check

      - name: Test before releasing
        run: nix develop .#ci --impure -c make test test-integration
        env:
          AUTOMATA_TEST_DB: Host=127.0.0.1;Port=5432;Database=bs-automata;Username=bs-automata;Password=bs-automata
          AUTOMATA_TEST_CRON_DB: Host=127.0.0.1;Port=5432;Database=bs-automata;Username=runner
      - name: Pack and smoke-test release
        run: nix develop .#ci --impure -c make package-smoke
      - name: Publish the packages to nuget.org
        run: nix develop .#ci --impure -c make push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

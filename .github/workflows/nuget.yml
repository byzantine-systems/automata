name: Nuget

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  push:
    name: Push to Nuget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          # Mostly to avoid GitHub rate limiting
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      - name: Test before releasing
        run: nix develop .#ci --impure -c make test
      - name: Pack and smoke-test release
        run: nix develop .#ci --impure -c make package-smoke
      - name: Publish the packages to nuget.org
        run: nix develop .#ci --impure -c make push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

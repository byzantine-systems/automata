name: Nuget

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  push:
    name: Push to Nuget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          # Mostly to avoid GitHub rate limiting
          # keep-env-derivations/keep-outputs protect the ci shell's flake inputs
          # and shell derivation from the pre-save garbage collection below.
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Test before releasing
        run: nix develop .#ci --impure -c make test
      - name: Pack and smoke-test release
        run: nix develop .#ci --impure -c make package-smoke
      - name: Publish the packages to nuget.org
        run: nix develop .#ci --impure -c make push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

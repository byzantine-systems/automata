name: Create Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          # keep-env-derivations/keep-outputs protect the ci shell's flake inputs
          # and shell derivation from the pre-save garbage collection below.
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            keep-env-derivations = true
            keep-outputs = true
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - name: Build documentation
        run: nix develop .#ci --impure -c make docs
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation-${{ github.ref_name }}
          path: out/docs
          if-no-files-found: error
      - name: Create Release
        run: gh release create ${{ github.ref }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
